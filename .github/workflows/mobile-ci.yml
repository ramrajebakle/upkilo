name: Mobile CI (Detox)

on:
  push:
    branches: [main, develop, ramraje]
    paths:
      - 'src/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/mobile/**'

env:
  NODE_VERSION: '20.x'
  JAVA_VERSION: '17'

jobs:
  # ── TypeScript check + unit tests (fast, no emulator) ─────────────────────
  mobile-lint-and-types:
    name: Mobile Lint & TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0 || true

  # ── Android Detox E2E (emulator) ──────────────────────────────────────────
  mobile-e2e-android:
    name: Android E2E (Detox)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Install Detox CLI
        run: npm install -g detox-cli

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Detox debug APK
        run: |
          cd android
          ./gradlew assembleDebug assembleAndroidTest -DtestBuildType=debug
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:5000/api/v1

      - name: Create AVD and run Detox tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          script: |
            cd src/mobile
            detox test --configuration android.emu.debug --headless --record-logs all
          working-directory: .

      - name: Upload Detox artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: detox-android-artifacts
          path: src/mobile/artifacts/

  # ── EAS build validation (no emulator needed) ─────────────────────────────
  eas-build-check:
    name: EAS Build Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate app.json schema
        run: |
          node -e "
            const cfg = require('./app.json');
            const builds = cfg?.eas?.build ?? {};
            const required = ['development', 'preview', 'production'];
            for (const env of required) {
              if (!builds[env]) { console.error('Missing EAS build profile: ' + env); process.exit(1); }
              const apiUrl = builds[env]?.env?.EXPO_PUBLIC_API_URL;
              if (!apiUrl) { console.error('Missing EXPO_PUBLIC_API_URL in ' + env); process.exit(1); }
              if (env !== 'development' && apiUrl.includes('localhost')) {
                console.error('Production/preview profile still uses localhost: ' + env);
                process.exit(1);
              }
            }
            console.log('EAS build config validated successfully.');
          "

      - name: Check for hardcoded localhost in API client
        run: |
          if grep -r "localhost:5000" src/api/ --include="*.ts" | grep -v "??" | grep -v "//"; then
            echo "::error::Hardcoded localhost found in API client (should use env var)"
            exit 1
          fi
          echo "No hardcoded localhost URLs found."
