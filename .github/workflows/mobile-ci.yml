name: Mobile CI (Detox)

# workflow_dispatch is REQUIRED here, not a convenience. Every other workflow in this
# repo is registered with Actions because it either has run or is manually dispatchable.
# This one had neither: its push/pull_request triggers are both path-filtered to
# src/mobile/**, and nothing has touched src/mobile since the initial commit — so GitHub
# never listed it and it has never run once. A manual trigger keeps it visible and
# runnable even during periods when the mobile app is not being changed.
on:
  push:
    branches: [main, develop, ramraje]
    paths:
      - 'src/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/mobile/**'
      # Kept in step with the push filter above: a change to this file must be
      # validated by the run that changes it, on PRs as well as on pushes.
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

# Path filters on the TRIGGER are the cheapest possible change detection — a run that
# never starts bills nothing at all. The Expo app has no dependency on src/backend or
# src/frontend, so it needs none of detect-changes.yml's cross-component reasoning and
# deliberately does not call it.
permissions:
  contents: read

env:
  NODE_VERSION: '20.x'
  JAVA_VERSION: '17'

jobs:
  # ── TypeScript check + unit tests (fast, no emulator) ─────────────────────
  mobile-lint-and-types:
    name: Mobile Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skips the pull_request-triggered run when the PR's head branch already triggers this
    # workflow directly via `push` (same list as `on: push: branches:` above — keep in
    # sync). Without this, a PR from ramraje touching src/mobile/** runs this job twice for
    # the identical commit. Not applied to mobile-e2e-android below: that job already only
    # runs on pull_request (never push), so it was never duplicated in the first place —
    # adding this condition there would remove its only trigger for ramraje-sourced PRs
    # instead of deduplicating it.
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !contains(fromJSON('["main","develop","ramraje"]'), github.event.pull_request.head.ref)
    defaults:
      run:
        working-directory: src/mobile

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0 || true

  # ── Android Detox E2E (emulator) ──────────────────────────────────────────
  mobile-e2e-android:
    name: Android E2E (Detox)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/mobile

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json

      # Moved ahead of "Setup Java": this is an Expo-managed project with no android/
      # directory checked in, and Setup Java's cache: gradle option globs for
      # **/*.gradle*, **/gradle-wrapper.properties etc. across the whole checkout to build
      # its cache key. With no android/ yet, that glob matches nothing, which
      # actions/setup-java treats as a hard error ("No file in ... matched to [...]") —
      # not a warning — and the job was failing there, before ever reaching the gradlew
      # invocation four steps later that would have failed for the same underlying reason
      # (cd android: No such file or directory).
      - name: Install dependencies
        run: npm ci

      # Generates the native android/ project from app.json (android.package is already
      # set there) so every step after this can assume it exists, exactly as a bare/prebuilt
      # React Native project would. --non-interactive: no TTY on a runner to answer prompts.
      - name: Expo prebuild (generate native Android project)
        run: npx expo prebuild --platform android --non-interactive

      # The wrapper prebuild generates pins Gradle 8.14.3, but the Android Gradle Plugin
      # version prebuild ALSO generates into android/build.gradle requires >= 9.4.1 --
      # an internal inconsistency in this expo/react-native version's own templates, not
      # something under this repo's control.
      #
      # This edits gradle-wrapper.properties directly rather than running
      # `./gradlew wrapper --gradle-version 9.4.1`: that command still executes on the OLD
      # 8.14.3 binary, and Gradle's configuration phase evaluates every subproject --
      # including :app -- before running ANY task, regardless of which one was requested.
      # :app applies AGP, whose own version-check plugin is exactly what refused to
      # configure under Gradle 8.14.3 in the first place ("A problem occurred evaluating
      # project ':app'"), so invoking gradlew at all on the old binary hits the same wall
      # before it could ever update itself. Patching the file directly needs no Gradle
      # invocation, so there is nothing for that check to block.
      # node, not sed: the value needed here is "https\://..." (Java .properties escapes ':'
      # as '\:', which every real gradle-wrapper.properties file already does for its
      # scheme separator), and getting a literal single backslash through both a bash
      # single-quoted string AND a sed replacement is two stacked, easy-to-get-wrong
      # escaping layers. A JS regex replacement on the file's actual text has one
      # unambiguous escaping rule.
      - name: Fix generated Gradle wrapper version (AGP requires >= 9.4.1)
        run: |
          node -e "
            const fs = require('fs');
            const p = 'android/gradle/wrapper/gradle-wrapper.properties';
            const before = fs.readFileSync(p, 'utf8');
            const after = before.replace(
              /^distributionUrl=.*$/m,
              'distributionUrl=https\\\\://services.gradle.org/distributions/gradle-9.4.1-bin.zip'
            );
            if (before === after) { throw new Error('distributionUrl line not found/replaced'); }
            fs.writeFileSync(p, after);
            console.log(after.match(/^distributionUrl=.*$/m)[0]);
          "

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Detox CLI
        run: npm install -g detox-cli

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Detox debug APK
        run: |
          cd android
          ./gradlew assembleDebug assembleAndroidTest -DtestBuildType=debug
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:5000/api/v1

      - name: Create AVD and run Detox tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          script: |
            cd src/mobile
            detox test --configuration android.emu.debug --headless --record-logs all
          working-directory: .

      - name: Upload Detox artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: detox-android-artifacts
          path: src/mobile/artifacts/

  # ── EAS build validation (no emulator needed) ─────────────────────────────
  eas-build-check:
    name: EAS Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same anti-duplicate-run condition as mobile-lint-and-types above (keep both in sync).
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !contains(fromJSON('["main","develop","ramraje"]'), github.event.pull_request.head.ref)
    defaults:
      run:
        working-directory: src/mobile

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate eas.json schema
        run: |
          node -e "
            const cfg = require('./eas.json');
            const builds = cfg?.build ?? {};
            const required = ['development', 'preview', 'production'];
            for (const env of required) {
              if (!builds[env]) { console.error('Missing EAS build profile: ' + env); process.exit(1); }
              const apiUrl = builds[env]?.env?.EXPO_PUBLIC_API_URL;
              if (!apiUrl) { console.error('Missing EXPO_PUBLIC_API_URL in ' + env); process.exit(1); }
              if (env !== 'development' && apiUrl.includes('localhost')) {
                console.error('Production/preview profile still uses localhost: ' + env);
                process.exit(1);
              }
            }
            console.log('EAS build config validated successfully.');
          "

      - name: Check for hardcoded localhost in API client
        run: |
          # The safe pattern is an env-var fallback spanning two lines:
          #   process.env.EXPO_PUBLIC_API_URL ??
          #   'http://localhost:5000/api/v1';
          # so the invariant is per-FILE, not per-line. The previous line-based filter
          # piped through `grep -v "//"`, which discarded every `http://localhost` match —
          # i.e. exactly what it was meant to catch — so the check could never fail.
          status=0
          for file in $(grep -rl "localhost:5000" src/api/ --include="*.ts" || true); do
            if ! grep -q "EXPO_PUBLIC_API_URL" "$file"; then
              echo "::error file=$file::Hardcoded localhost:5000 with no EXPO_PUBLIC_API_URL fallback"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "All localhost:5000 references sit behind an EXPO_PUBLIC_API_URL fallback."
          fi
          exit $status
