name: Upkilo Production Deploy

# push builds automatically on merge to main so a human who's ready to deploy isn't also
# waiting on a fresh build first — deploy-production/migrate-database still require an
# explicit workflow_dispatch regardless (see their own `if:` conditions below), so a push
# here can never deploy anything by itself, only pre-build the images for whenever a human
# actually dispatches. build-and-push itself skips Dependabot merges (see its `if:` below)
# — those don't warrant a fresh image on their own, and this workflow previously built one
# for every single one of them (patch bumps included) with nothing ever consuming it, which
# is pure recurring cost. A real feature merge still gets built immediately.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      force-rebuild:
        description: >-
          Rebuild both images even when an image for this exact source fingerprint
          already exists. Needed after rotating a secret that is passed as a build arg
          (SENTRY_DSN, VAPID_PUBLIC_KEY) — those change no tracked file, so the
          fingerprint alone cannot see them.
        required: false
        default: false
        type: boolean

# Serializes runs so a double-dispatch cannot run migrate-database/deploy-production in
# parallel against the same production App Service and database. cancel-in-progress is
# deliberately false: a deploy in flight may already have applied migrations or be
# mid-swap, so a new trigger should queue behind it, not cancel it and leave production
# half-deployed.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  REGISTRY: upkiloprod.azurecr.io

jobs:
  # ── Preflight: does the chosen target actually exist? ──────────────────
  #
  # Selecting "staging" used to produce a green run that deployed nothing, because every
  # staging job is gated on `vars.STAGING_ENABLED == 'true'` and that variable is unset.
  # A skipped job reports success, so the run looked identical to a successful staging
  # deploy — which is how "I deployed to staging" and "nothing happened" became
  # indistinguishable.
  #
  # Failing here makes the missing prerequisite explicit and actionable instead.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Reject a staging deploy when staging is not provisioned
        if: inputs.environment == 'staging' && vars.STAGING_ENABLED != 'true'
        run: |
          echo "::error::Target environment is 'staging' but the repository variable STAGING_ENABLED is not 'true', so every staging job would be skipped and this run would deploy nothing while reporting success."
          echo "To enable staging: Settings -> Secrets and variables -> Actions -> Variables -> new variable STAGING_ENABLED = true."
          echo "The staging Azure resources and STAGING_* secrets must exist first, otherwise the staging jobs will fail on login."
          exit 1

      - name: Report target
        run: |
          echo "Target environment: ${{ inputs.environment }}"
          echo "Staging enabled:    ${{ vars.STAGING_ENABLED == 'true' }}"
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "::notice::This run WILL migrate and deploy PRODUCTION."
          else
            echo "::notice::This run targets staging only. Production jobs are skipped."
          fi

  # ── Build Docker Images & Push to ACR ─────────────────────────────
  #
  # ── Content-addressed image reuse ────────────────────────────────────────────────
  # Both images used to be rebuilt on every single run, including the very common case
  # where the run's commit did not touch that component at all — a frontend-only merge
  # still paid a full .NET SDK restore + publish to produce a byte-identical API image.
  #
  # The fix is not a path filter. Each image now carries a third tag, `src-<fingerprint>`,
  # derived from the git TREE hash of the source that actually goes into it. Before
  # building, this job asks the registry whether that exact fingerprint already exists:
  #
  #   present -> copy the manifest onto :<sha> and :latest (a registry-side operation,
  #              seconds, no layer transfer, no runner CPU)
  #   absent  -> build and push, tagging :<sha>, :latest and :src-<fingerprint>
  #
  # This is strictly safer than diffing against the previous commit, because it depends on
  # the CONTENT of the tree rather than on the run history. It stays correct across
  # force-pushes, across reverts (a revert instantly reuses the pre-revert image), and
  # across the Dependabot-merge skip below — none of which a "did the last push touch it?"
  # filter survives, since each of them can leave `latest` describing source that is no
  # longer what HEAD contains.
  #
  # Deliberately ONE job rather than two parallel ones: Actions bills the sum of every
  # job's minutes, so splitting these into parallel jobs would improve wall-clock at the
  # cost of a second checkout, a second buildx setup and a second registry login on every
  # run. When only one image needs building — the common case, now — there is nothing to
  # parallelise anyway.
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Skip Dependabot merges specifically: workflow_dispatch always rebuilds from current
    # main regardless of this job, so this condition doesn't cost any deploy real coverage
    # — it only decides whether a build happens speculatively, ahead of anyone asking for
    # one. head_commit.author.name (not github.actor) is what carries the ORIGINAL PR
    # author through a squash-merge — github.actor on the resulting push instead reflects
    # whatever identity performed the merge (github-actions[bot], via
    # dependabot-auto-merge.yml's GITHUB_TOKEN), not dependabot[bot] itself.
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.name != 'dependabot[bot]'
    outputs:
      image-tag: ${{ github.sha }}
      api-rebuilt: ${{ steps.api.outputs.build }}
      frontend-rebuilt: ${{ steps.frontend.outputs.build }}

    steps:
      - uses: actions/checkout@v7

      - name: Login to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `git rev-parse HEAD:<dir>` returns that directory's TREE object id — a hash of its
      # entire recursive content. Two commits with identical source under that path
      # produce the same id, which is exactly the property this reuse depends on.
      #
      # Each fingerprint also folds in the files OUTSIDE the source tree that change what
      # the image contains:
      #   API      — the root Dockerfile and .dockerignore (its build recipe and context).
      #   Frontend — its own Dockerfile is already inside src/frontend, but the
      #              NEXT_PUBLIC_* build args below are inlined into the client bundle and
      #              are declared in THIS file, so deploy.yml itself is part of the input.
      #
      # Known limit: a rotated SECRET value passed as a build arg (SENTRY_DSN,
      # VAPID_PUBLIC_KEY) does not change any tracked file, so it will not invalidate the
      # fingerprint. Use the `force-rebuild` dispatch input after rotating one.
      - name: Fingerprint deployable source
        id: fp
        run: |
          set -euo pipefail
          api=$( { git rev-parse "HEAD:src/backend"; git hash-object Dockerfile .dockerignore; } \
                 | sha256sum | cut -c1-16 )
          frontend=$( { git rev-parse "HEAD:src/frontend"; git hash-object .github/workflows/deploy.yml; } \
                 | sha256sum | cut -c1-16 )
          echo "api=$api"           >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "API source fingerprint:      $api"
          echo "Frontend source fingerprint: $frontend"

      # ── API image ──────────────────────────────────────────────────
      - name: Resolve API image
        id: api
        env:
          FORCE: ${{ inputs.force-rebuild }}
          SRC_TAG: ${{ env.REGISTRY }}/upkilo-api:src-${{ steps.fp.outputs.api }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "force-rebuild requested — building."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # `imagetools inspect` rather than `docker manifest inspect`: it goes through
          # buildx (already set up above) and does not depend on the CLI's experimental
          # manifest command being enabled on the runner image.
          if docker buildx imagetools inspect "$SRC_TAG" >/dev/null 2>&1; then
            echo "✅ Identical API source already built — reusing $SRC_TAG"
            docker buildx imagetools create \
              --tag "${{ env.REGISTRY }}/upkilo-api:${{ github.sha }}" \
              --tag "${{ env.REGISTRY }}/upkilo-api:latest" \
              "$SRC_TAG"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No image for this API source fingerprint — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Push API Image
        if: steps.api.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/upkilo-api:${{ github.sha }}
            ${{ env.REGISTRY }}/upkilo-api:latest
            ${{ env.REGISTRY }}/upkilo-api:src-${{ steps.fp.outputs.api }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/upkilo-api:latest
          cache-to: type=inline

      # ── Frontend image ─────────────────────────────────────────────
      - name: Resolve frontend image
        id: frontend
        env:
          FORCE: ${{ inputs.force-rebuild }}
          SRC_TAG: ${{ env.REGISTRY }}/upkilo-frontend:src-${{ steps.fp.outputs.frontend }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "force-rebuild requested — building."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if docker buildx imagetools inspect "$SRC_TAG" >/dev/null 2>&1; then
            echo "✅ Identical frontend source already built — reusing $SRC_TAG"
            docker buildx imagetools create \
              --tag "${{ env.REGISTRY }}/upkilo-frontend:${{ github.sha }}" \
              --tag "${{ env.REGISTRY }}/upkilo-frontend:latest" \
              "$SRC_TAG"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No image for this frontend source fingerprint — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Push Frontend Image
        if: steps.frontend.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/upkilo-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/upkilo-frontend:latest
            ${{ env.REGISTRY }}/upkilo-frontend:src-${{ steps.fp.outputs.frontend }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/upkilo-frontend:latest
          cache-to: type=inline
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.upkilo.com
            NEXT_PUBLIC_SIGNALR_URL=https://api.upkilo.com/hubs/notifications
            NEXT_PUBLIC_APP_NAME=Upkilo
            # Apex is the canonical marketing/SEO host (sitemap.ts, robots.ts);
            # the dashboard lives on the app subdomain. middleware.ts routes between them.
            NEXT_PUBLIC_SITE_URL=https://upkilo.com
            NEXT_PUBLIC_APP_URL=https://app.upkilo.com
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time, and Docker
      # silently drops --build-arg values the Dockerfile does not declare with ARG. When that
      # happened the build fell back to next.config.js's http://localhost:5000 default and
      # every browser called its own machine — while CI stayed green, because the frontend
      # health probe hits a server route that never uses the API base URL. Assert on the
      # built artifact so the failure can never be silent again.
      #
      # Only runs when the image was actually built: a reused image already cleared this
      # guard on the run that produced it, and pulling it back down to re-prove an
      # unchanged fact is the cost this job exists to avoid.
      - name: Guard — no localhost API URL baked into production bundle
        if: steps.frontend.outputs.build == 'true'
        run: |
          if docker run --rm --entrypoint sh \
               ${{ env.REGISTRY }}/upkilo-frontend:${{ github.sha }} \
               -c "grep -rq 'localhost:5000' .next/static" 2>/dev/null; then
            echo "::error::localhost:5000 was baked into the production client bundle. Check that src/frontend/Dockerfile declares ARG NEXT_PUBLIC_API_URL in the builder stage before 'RUN npm run build'."
            exit 1
          fi
          echo "✅ No localhost API URL in the production bundle"

      # ── Staging frontend image ─────────────────────────────────────
      # The NEXT_PUBLIC_* values above are inlined into the client bundle at build time
      # (that is exactly what the guard immediately above proves), so a staging deployment
      # CANNOT reuse the production frontend image — it would serve a working site whose
      # browsers call https://api.upkilo.com. Staging therefore needs its own build.
      #
      # It carries its own `src-staging-<fingerprint>` tag so the reuse optimisation still
      # applies, and is deliberately NOT tagged `latest`: that tag feeds the production
      # reuse lookup above and must never describe a staging build.
      - name: Resolve staging frontend image
        id: frontend-staging
        if: vars.STAGING_ENABLED == 'true'
        env:
          FORCE: ${{ inputs.force-rebuild }}
          SRC_TAG: ${{ env.REGISTRY }}/upkilo-frontend:src-staging-${{ steps.fp.outputs.frontend }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "force-rebuild requested — building."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if docker buildx imagetools inspect "$SRC_TAG" >/dev/null 2>&1; then
            echo "✅ Identical staging frontend source already built — reusing $SRC_TAG"
            docker buildx imagetools create \
              --tag "${{ env.REGISTRY }}/upkilo-frontend:staging-${{ github.sha }}" \
              "$SRC_TAG"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No image for this staging frontend source fingerprint — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # SITE_URL and APP_URL collapse onto one hostname because staging has no apex/app
      # split. That is safe: hostRoutingResponse() in middleware.ts returns early for any
      # host that is not upkilo.com/www/app, so test.upkilo.com never reaches the
      # marketing-vs-dashboard redirect logic and nothing redirects.
      #
      # Hostnames are deliberately FLAT (api-test, not api.test). Cloudflare's free
      # Universal SSL covers the apex and one subdomain level only — a nested
      # api.test.upkilo.com would have no certificate without Advanced Certificate
      # Manager (~$10/mo) or dropping the proxy.
      - name: Build & Push Staging Frontend Image
        if: vars.STAGING_ENABLED == 'true' && steps.frontend-staging.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/upkilo-frontend:staging-${{ github.sha }}
            ${{ env.REGISTRY }}/upkilo-frontend:src-staging-${{ steps.fp.outputs.frontend }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/upkilo-frontend:latest
          cache-to: type=inline
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-test.upkilo.com
            NEXT_PUBLIC_SIGNALR_URL=https://api-test.upkilo.com/hubs/notifications
            NEXT_PUBLIC_APP_NAME=Upkilo Staging
            NEXT_PUBLIC_SITE_URL=https://test.upkilo.com
            NEXT_PUBLIC_APP_URL=https://test.upkilo.com
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}

      - name: Summarise image resolution
        if: always()
        run: |
          verdict() { if [ "$1" = "true" ]; then echo "rebuilt"; else echo "reused (identical source)"; fi; }
          {
            echo "### Images for \`${{ github.sha }}\`"
            echo
            echo "| Image | Fingerprint | Outcome |"
            echo "| --- | --- | --- |"
            echo "| upkilo-api | \`src-${{ steps.fp.outputs.api }}\` | $(verdict '${{ steps.api.outputs.build }}') |"
            echo "| upkilo-frontend | \`src-${{ steps.fp.outputs.frontend }}\` | $(verdict '${{ steps.frontend.outputs.build }}') |"
          } >> "$GITHUB_STEP_SUMMARY"
  # ── Staging Migration (rehearsal) ─────────────────────────────────
  # Runs the same migrations against the staging database FIRST, so a destructive or
  # long-running migration fails here rather than against customer data. This job is
  # the reason a separate staging environment exists — the production app's own
  # `staging` slot shares the production database and cannot rehearse a migration.
  migrate-staging:
    name: Migrate Staging DB (rehearsal)
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Two conditions, both required.
    #
    # STAGING_ENABLED is the provisioning switch: while unset, this job and deploy-staging
    # skip entirely. It is now set, and that alone used to be the whole condition — which
    # meant enabling it silently turned every push to main into an automatic staging
    # migration and deploy. A migration mutates a database; nothing that mutates a database
    # should start because someone merged a PR.
    #
    # github.event_name == 'workflow_dispatch' is the manual gate, matching migrate-database
    # and deploy-production. Nothing in this workflow deploys or migrates ANYTHING without a
    # human pressing Run workflow.
    #
    # Deliberately NOT restricted to inputs.environment == 'staging': a production dispatch
    # must still rehearse the migration and boot the image on staging first, which is what
    # migrate-database's `needs` depends on.
    if: github.event_name == 'workflow_dispatch' && vars.STAGING_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v7

      # Required before any azure/CLI step. The azure/CLI action does NOT authenticate
      # from an AZURE_CREDENTIALS env var — it relies on the session established here.
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}

      # Same constraint as production (see migrate-database): the Postgres firewall only
      # permits Azure services, and GitHub-hosted runners have dynamic public IPs that the
      # rule does not cover. Without this, `dotnet ef` cannot reach the staging server at
      # all — the rehearsal would fail on connectivity rather than on the migration.
      - name: Allow runner IP through staging Postgres firewall
        id: fw
        uses: azure/CLI@v3
        with:
          inlineScript: |
            RUNNER_IP=$(curl -s https://api.ipify.org)
            RULE="gha-${{ github.run_id }}"
            echo "rule_name=$RULE" >> $GITHUB_OUTPUT
            az postgres flexible-server firewall-rule create \
              --resource-group upkilo-staging-rg \
              --server-name upkilo-staging-db \
              --name "$RULE" \
              --start-ip-address "$RUNNER_IP" \
              --end-ip-address "$RUNNER_IP" \
              --output none
            echo "✅ Temporary firewall rule $RULE opened for $RUNNER_IP"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      # `dotnet ef` builds the startup project before it can read the model, and building
      # requires restored packages — the same requirement documented on migrate-database.
      # Without this the step fails with:
      #   Assets file '.../Upkilo.Infrastructure/obj/project.assets.json' not found.
      - name: Restore backend dependencies
        run: dotnet restore src/backend/Upkilo.sln

      - name: Apply migrations to staging
        run: |
          dotnet ef database update \
            --project src/backend/Upkilo.Infrastructure/Upkilo.Infrastructure.csproj \
            --startup-project src/backend/Upkilo.API/Upkilo.API.csproj \
            --verbose
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_STAGING_DB_CONNECTION }}
          AzureKeyVault__VaultUri: ""
          Jwt__Secret: "migration-placeholder-min-32-chars-not-used-for-auth-xxxxxxxxxx"
          Jwt__Issuer: "https://api.upkilo.com"
          Jwt__Audience: "https://app.upkilo.com"

      # MUST run even when the migration fails, or a failed rehearsal leaves the staging
      # database permanently reachable from a stale public IP. always() is deliberate.
      - name: Remove temporary staging Postgres firewall rule
        if: always() && steps.fw.outputs.rule_name != ''
        uses: azure/CLI@v3
        with:
          inlineScript: |
            az postgres flexible-server firewall-rule delete \
              --resource-group upkilo-staging-rg \
              --server-name upkilo-staging-db \
              --name "${{ steps.fw.outputs.rule_name }}" \
              --yes --output none || echo "⚠️ Rule already absent"
            echo "🔒 Temporary firewall rule removed"

  # ── Deploy to Staging ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: [build-and-push, migrate-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Manual gate, same as migrate-staging above — a push to main must never deploy anything.
    if: github.event_name == 'workflow_dispatch' && vars.STAGING_ENABLED == 'true'

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}

      # appsettings.Production.json holds "${VAR}" placeholders that .NET never expands,
      # and no Key Vault *configuration provider* is registered. Several consumers
      # (InvoiceService, DataErasureJob, SmsA2pRegistrationService) read Stripe/Twilio
      # straight from IConfiguration with no ISecretProvider fallback, so App Service
      # application settings are the only mechanism that reaches every consumer.
      # Without this the container crash-loops on the Jwt:Secret minimum-length check.
      #
      # The staging container runs as ASPNETCORE_ENVIRONMENT=Production (hardcoded in the
      # Dockerfile) so it exercises the same code paths as production — nothing branches
      # on IsStaging(). That means it also loads appsettings.Production.json, whose
      # production-facing values must be overridden here:
      #
      #   App__FrontendUrl  — builds password-reset, email-verification, invitation and
      #                       SSO links. Left at the default, every email sent from
      #                       staging would walk the recipient into PRODUCTION.
      #   Cors__AllowedOrigins__N — .NET overlays configuration arrays by INDEX; it does
      #                       not replace them. appsettings.Production.json defines three
      #                       origins, so all three indices must be overridden or the
      #                       production origins survive into staging. The duplicates are
      #                       intentional and harmless — CORS matching is exact-match.
      #
      # AllowedHosts MUST be set explicitly here. It used not to be, and the comment that
      # replaced said so — correctly, at the time, because staging ran with
      # ASPNETCORE_ENVIRONMENT unset and therefore defaulted to Production, which loaded
      # appsettings.Production.json and its
      #   "AllowedHosts": "*.upkilo.com;upkilo.com;*.azurewebsites.net"
      #
      # Setting ASPNETCORE_ENVIRONMENT=Staging below (which is right on its own terms) stops
      # that file loading, and there is no appsettings.Staging.json. AllowedHosts then falls
      # back to the base appsettings.json value of "localhost", so HostFilteringMiddleware
      # rejected every request with a real Host header. ASP.NET Core answers that with an
      # empty-bodied 400, which App Service renders as its own
      #   "Bad Request - Invalid Hostname"
      # page — an error that looks like DNS or a binding problem and is neither.
      - name: Configure Staging App Service application settings
        uses: azure/CLI@v3
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name upkilo-api-staging \
              --resource-group upkilo-staging-rg \
              --settings \
                ConnectionStrings__DefaultConnection="${{ secrets.AZURE_STAGING_DB_CONNECTION }}" \
                ConnectionStrings__ReplicaConnection="${{ secrets.AZURE_STAGING_DB_CONNECTION }}" \
                ConnectionStrings__Redis="${{ secrets.STAGING_REDIS_CONNECTION }}" \
                Jwt__Secret="${{ secrets.STAGING_JWT_SECRET }}" \
                Stripe__SecretKey="${{ secrets.STAGING_STRIPE_SECRET_KEY }}" \
                Stripe__WebhookSecret="${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}" \
                Stripe__PublishableKey="${{ secrets.STAGING_STRIPE_PUBLISHABLE_KEY }}" \
                Razorpay__KeyId="${{ secrets.STAGING_RAZORPAY_KEY_ID }}" \
                Razorpay__KeySecret="${{ secrets.STAGING_RAZORPAY_KEY_SECRET }}" \
                SendGrid__ApiKey="${{ secrets.STAGING_SENDGRID_API_KEY }}" \
                Twilio__AccountSid="${{ secrets.STAGING_TWILIO_ACCOUNT_SID }}" \
                Twilio__AuthToken="${{ secrets.STAGING_TWILIO_AUTH_TOKEN }}" \
                Twilio__PhoneNumber="${{ secrets.STAGING_TWILIO_PHONE_NUMBER }}" \
                AzureOpenAI__Endpoint="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
                AzureOpenAI__ApiKey="${{ secrets.AZURE_OPENAI_API_KEY }}" \
                Azure__Storage__ConnectionString="${{ secrets.AZURE_STAGING_STORAGE_CONNECTION_STRING }}" \
                App__FrontendUrl="https://test.upkilo.com" \
                Cors__AllowedOrigins__0="https://test.upkilo.com" \
                Cors__AllowedOrigins__1="https://test.upkilo.com" \
                Cors__AllowedOrigins__2="https://test.upkilo.com" \
                VAPID__PublicKey="${{ secrets.VAPID_PUBLIC_KEY }}" \
                VAPID__PrivateKey="${{ secrets.VAPID_PRIVATE_KEY }}" \
                Email__FromEmail="${{ secrets.STAGING_EMAIL_FROM || 'noreply@upkilo.com' }}" \
                Email__FromName="Upkilo (staging)" \
                Jwt__Issuer="https://api-test.upkilo.com" \
                Jwt__Audience="https://test.upkilo.com" \
                AzureKeyVault__VaultUri="" \
                SENTRY_DSN="${{ secrets.STAGING_SENTRY_DSN || secrets.SENTRY_DSN }}" \
                APPLICATIONINSIGHTS_CONNECTION_STRING="${{ secrets.STAGING_APPLICATIONINSIGHTS_CONNECTION_STRING || secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}" \
                PagerDuty__IntegrationKey="" \
                AllowedHosts="*.upkilo.com;upkilo.com;*.azurewebsites.net" \
                ASPNETCORE_ENVIRONMENT="Staging"
            echo "✅ Staging App Service settings configured"

      # Three deliberate differences from production, so "staging mirrors prod" does not become
      # a claim nobody checked:
      #
      #  1. PagerDuty is BLANK. Wiring it would page the on-call rotation for staging noise,
      #     which trains people to ignore the pager — worse than having none.
      #
      #  2. APPLICATIONINSIGHTS_CONNECTION_STRING and SENTRY_DSN fall back to the production
      #     values when no STAGING_* secret exists. That is the pragmatic choice, not the right
      #     one: staging telemetry then lands in the production resource and has to be told
      #     apart by cloud_RoleName / environment. Only ONE App Insights component exists
      #     (upkilo-prod-insights). Create a staging component and set
      #     STAGING_APPLICATIONINSIGHTS_CONNECTION_STRING to separate them — no workflow change
      #     needed, the fallback already handles it.
      #
      #     Setting this at all is the point: its ABSENCE is why staging could not reproduce the
      #     Application Insights startup crash that took production down, while every other
      #     gate reported green.
      #
      #  3. ASPNETCORE_ENVIRONMENT is "Staging", not "Production". That is correct — it keeps
      #     appsettings.Production.json out of the picture — but it does mean environment-gated
      #     code does NOT run here. ContentModerationService refuses only when IsProduction(),
      #     so that refusal is never exercised on staging. Anything guarded by IsProduction()
      #     is, by construction, untested before it reaches production.

      - name: Deploy API to Staging App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: upkilo-api-staging
          images: ${{ env.REGISTRY }}/upkilo-api:${{ github.sha }}

      # NextAuth v5 refuses to start without a signing secret and returns
      # "There was a problem with the server configuration" from every /api/auth/* route,
      # so login fails even though the API issues valid JWTs — the same failure mode
      # documented on the production frontend step below. These are RUNTIME settings
      # (unlike NEXT_PUBLIC_* which are baked at build), so they must live here.
      - name: Configure Staging Frontend App Service application settings
        uses: azure/CLI@v3
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name upkilo-frontend-staging \
              --resource-group upkilo-staging-rg \
              --settings \
                AUTH_SECRET="${{ secrets.STAGING_AUTH_SECRET }}" \
                NEXTAUTH_SECRET="${{ secrets.STAGING_AUTH_SECRET }}" \
                AUTH_TRUST_HOST="true" \
                NEXTAUTH_URL="https://test.upkilo.com" \
              --output none
            echo "✅ Staging frontend App Service settings configured"

      # Deploys the staging-specific image, NOT the production one. The production
      # frontend image has https://api.upkilo.com inlined into its client bundle at build
      # time, so deploying it here would produce a working staging site whose browsers
      # all call production. See "Build & Push Staging Frontend Image" in build-and-push.
      - name: Deploy Frontend to Staging App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: upkilo-frontend-staging
          images: ${{ env.REGISTRY }}/upkilo-frontend:staging-${{ github.sha }}

      # Probes the default azurewebsites.net hostname even though staging now has a custom
      # domain — same reasoning as the production gate below. That hostname bypasses
      # Cloudflare, so this gate measures the app itself rather than the CDN in front of
      # it, and it keeps working before DNS/TLS has finished propagating. The custom
      # domain is verified separately once both apps are up.
      # Poll /ready (DB + Redis + Hangfire), not /health (liveness: memory/uptime only).
      # B-series tiers are slow to cold-start, hence the longer deadline.
      - name: Smoke test staging — await readiness
        env:
          PUBLIC_URL: https://api-test.upkilo.com/ready
          DIRECT_URL: https://upkilo-api-staging.azurewebsites.net/ready
        run: |
          echo "Polling staging /ready on $PUBLIC_URL (max 180s)..."
          deadline=$((SECONDS + 180))
          until curl -sf "$PUBLIC_URL" | jq -e '.status != "Unhealthy"' > /dev/null 2>&1; do
            if [ $SECONDS -ge $deadline ]; then
              echo "❌ Staging readiness timed out — production deploy blocked"
              # Report the failure in a form a human can read.
              #
              # This used to pipe the response straight into jq, so when App Service returned
              # its own HTML 503 the only output was
              #   jq: parse error: Invalid numeric literal at line 1, column 10
              # which says nothing about the app being down. Print the status code and the
              # first bytes of the body instead.
              code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$PUBLIC_URL" || echo 000)
              echo "   $PUBLIC_URL -> HTTP $code"
              echo "   body: $(head -c 300 /tmp/body 2>/dev/null)"

              # Then the hostname that bypasses Cloudflare, which separates "the app is broken"
              # from "DNS/TLS/CDN in front of it is broken" — two very different fixes.
              dcode=$(curl -s -o /tmp/dbody -w '%{http_code}' --max-time 20 "$DIRECT_URL" || echo 000)
              echo "   $DIRECT_URL -> HTTP $dcode"
              if [ "$dcode" = "200" ]; then
                echo "::error::App is healthy on the direct hostname but not on api-test.upkilo.com — check the Cloudflare CNAME, the custom-domain binding and its certificate."
              else
                echo "::error::App is unhealthy on BOTH hostnames — this is the application, not DNS. Check container logs."
              fi
              exit 1
            fi
            sleep 5
          done
          echo "✅ Staging readiness OK on $PUBLIC_URL (nothing Unhealthy)"

      # The staging frontend had no probe at all, which is why a missing AUTH_SECRET
      # could not have been caught here — /api/health is a server route that boots the
      # Next.js app, so a NextAuth misconfiguration surfaces before production is touched.
      - name: Smoke test staging frontend
        env:
          PUBLIC_URL: https://test.upkilo.com/api/health
          DIRECT_URL: https://upkilo-frontend-staging.azurewebsites.net/api/health
        run: |
          echo "Polling staging frontend on $PUBLIC_URL (max 180s)..."
          deadline=$((SECONDS + 180))
          until curl -sf "$PUBLIC_URL" > /dev/null 2>&1; do
            if [ $SECONDS -ge $deadline ]; then
              echo "❌ Staging frontend health timed out — production deploy blocked"
              code=$(curl -s -o /tmp/fbody -w '%{http_code}' --max-time 20 "$PUBLIC_URL" || echo 000)
              echo "   $PUBLIC_URL -> HTTP $code"
              echo "   body: $(head -c 300 /tmp/fbody 2>/dev/null)"
              dcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$DIRECT_URL" || echo 000)
              echo "   $DIRECT_URL -> HTTP $dcode"
              if [ "$dcode" = "200" ]; then
                echo "::error::Frontend is healthy on the direct hostname but not on test.upkilo.com — DNS/TLS/CDN issue, not the app."
              else
                echo "::error::Frontend is unhealthy on BOTH hostnames — check AUTH_SECRET and the container logs."
              fi
              exit 1
            fi
            sleep 5
          done
          echo "✅ Staging frontend healthy on $PUBLIC_URL"

      # Non-fatal: proves the custom domain, its TLS binding and the Cloudflare proxy are
      # actually wired up, WITHOUT letting a DNS/CDN problem fail a deploy whose app is
      # demonstrably healthy (both gates above already passed on the direct hostnames).
      # Both hosts are deliberately flat — Cloudflare's free Universal SSL does not cover
      # a nested api.test.upkilo.com.
      - name: Verify staging custom domain (non-fatal)
        run: |
          for url in https://test.upkilo.com/api/health https://api-test.upkilo.com/ready; do
            if curl -sf --max-time 20 "$url" > /dev/null 2>&1; then
              echo "✅ $url reachable"
            else
              echo "⚠️ $url NOT reachable — check the Cloudflare CNAME, the App Service"
              echo "   custom-domain binding and its managed certificate. Non-blocking."
            fi
          done

  # ── Database Migration (with backup first) ────────────────────────
  # Gated on deploy-staging: the migration has already been rehearsed against the
  # staging database and the app has been proven to boot against the new schema.
  migrate-database:
    name: Database Migration
    needs: [build-and-push, migrate-staging, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # MANUAL GATE: migrations mutate production data, so they only run on an explicit
    # workflow_dispatch — never automatically on push. GitHub Free does not offer
    # environment protection rules (required reviewers) on private repos, so this
    # condition IS the approval gate. Do not remove it without adding one.
    #
    # `always()` is additionally required because a skipped `needs` dependency would
    # otherwise skip this job too. Skipped staging (not provisioned) is acceptable;
    # FAILED staging must still block production — hence the explicit result checks.
    #
    # migrate-staging is checked SEPARATELY from deploy-staging. When the rehearsal
    # migration fails, deploy-staging does not run and reports `skipped`, not `failure` —
    # which the deploy-staging clause below explicitly permits. Checking only deploy-staging
    # therefore let a failed rehearsal wave the production migration through, defeating the
    # entire reason migrate-staging exists.
    #
    # `inputs.environment == 'production'` is what makes the Target environment dropdown
    # mean anything. Without it this job — and deploy-production below — ran on EVERY
    # workflow_dispatch, so choosing "staging" migrated and deployed PRODUCTION. The input
    # was declared, rendered in the UI, defaulted to 'staging', and then referenced nowhere
    # in the file: a selector that implied a safety it did not provide.
    if: >-
      always()
      && github.event_name == 'workflow_dispatch'
      && inputs.environment == 'production'
      && needs.build-and-push.result == 'success'
      && needs.migrate-staging.result != 'failure'
      && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')

    steps:
      - uses: actions/checkout@v7

      # Required before any azure/CLI step. The azure/CLI action does NOT authenticate
      # from an AZURE_CREDENTIALS env var — it relies on the session established here.
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The Postgres firewall only permits Azure services. GitHub-hosted runners have
      # dynamic public IPs that are not reliably covered by that rule, so `dotnet ef`
      # cannot reach the server without an explicit allow. Open a narrow, single-IP
      # rule for this run and remove it afterwards (see the always() cleanup step).
      - name: Allow runner IP through Postgres firewall
        id: fw
        uses: azure/CLI@v3
        with:
          inlineScript: |
            RUNNER_IP=$(curl -s https://api.ipify.org)
            RULE="gha-${{ github.run_id }}"
            echo "rule_name=$RULE" >> $GITHUB_OUTPUT
            az postgres flexible-server firewall-rule create \
              --resource-group upkilo-prod-rg \
              --server-name upkilo-prod-db \
              --name "$RULE" \
              --start-ip-address "$RUNNER_IP" \
              --end-ip-address "$RUNNER_IP" \
              --output none
            echo "✅ Temporary firewall rule $RULE opened for $RUNNER_IP"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      # `dotnet ef` builds the startup project before it can read the model, and building
      # requires restored packages. Without this the EF steps fail with:
      #   Assets file '.../Upkilo.Infrastructure/obj/project.assets.json' not found.
      # Restoring the whole solution once here covers both EF steps below.
      - name: Restore backend dependencies
        run: dotnet restore src/backend/Upkilo.sln

      # CRITICAL-06: establish a recoverable restore point BEFORE every migration.
      #
      # This previously called `az postgres flexible-server backup create`, which CANNOT
      # work here — Azure rejects it on Burstable tier:
      #   (CustomerOnDemandBackupCannotBePerformedOnBurstableServer)
      # It also used the wrong flags (--name for the server, plus a non-existent
      # --backup-name). It failed every run.
      #
      # The server has automated backups with 7-day point-in-time restore, which covers
      # this scenario properly: PITR can rewind to any moment in the window, including the
      # instant before these migrations ran. Record that timestamp so an incident does not
      # require guessing it. See §9 of docs/PRODUCTION_DEPLOYMENT.md for the restore steps.
      - name: Record pre-migration restore point
        uses: azure/CLI@v3
        with:
          inlineScript: |
            RESTORE_POINT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            EARLIEST=$(az postgres flexible-server show \
              --resource-group upkilo-prod-rg --name upkilo-prod-db \
              --query "backup.earliestRestoreDate" -o tsv)
            RETENTION=$(az postgres flexible-server show \
              --resource-group upkilo-prod-rg --name upkilo-prod-db \
              --query "backup.backupRetentionDays" -o tsv)
            if [ -z "$EARLIEST" ]; then
              echo "::error::Could not read backup configuration — refusing to migrate without a verified restore point."
              exit 1
            fi
            echo "✅ Pre-migration restore point: $RESTORE_POINT"
            echo "   PITR window: $EARLIEST → now (${RETENTION}-day retention)"
            {
              echo "### Database restore point"
              echo ""
              echo "Restore to **$RESTORE_POINT** to rewind the migrations in this deploy:"
              echo '```bash'
              echo "az postgres flexible-server restore \\"
              echo "  --resource-group upkilo-prod-rg \\"
              echo "  --name upkilo-prod-db-restored \\"
              echo "  --source-server upkilo-prod-db \\"
              echo "  --restore-time $RESTORE_POINT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

      # CRITICAL-06: Generate idempotent SQL script for review/audit
      - name: Generate migration SQL script
        run: |
          dotnet ef migrations script --idempotent \
            --project src/backend/Upkilo.Infrastructure/Upkilo.Infrastructure.csproj \
            --startup-project src/backend/Upkilo.API/Upkilo.API.csproj \
            --output migration-${{ github.sha }}.sql
          echo "=== Migration SQL Preview (first 50 lines) ==="
          head -50 migration-${{ github.sha }}.sql
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_PROD_DB_CONNECTION }}
          AzureKeyVault__VaultUri: ""

      - name: Upload migration script as artifact
        uses: actions/upload-artifact@v7
        with:
          name: migration-sql-${{ github.sha }}
          path: migration-${{ github.sha }}.sql
          retention-days: 90

      # Snapshot the migration that is about to become "the previous one," so `rollback`
      # has a real target if this deploy's migrations need to be undone later. Must run
      # BEFORE "Apply migrations" — it records where the database actually is right now,
      # not where this deploy is about to take it.
      #
      # Surfaced in the job summary rather than written automatically: GITHUB_TOKEN's
      # write access does not reliably extend to repository variables the way it does to
      # contents/PRs, so this follows the same pattern as "Record pre-migration restore
      # point" above — put the exact command where a human can paste it in one step,
      # rather than have ROLLBACK_TARGET_MIGRATION silently stay stale.
      #
      # `migrations list` marks anything not yet applied to THIS database with "(Pending)";
      # the last line without that suffix is the last one already applied.
      - name: Record current migration as the rollback target
        run: |
          CURRENT=$(dotnet ef migrations list \
            --project src/backend/Upkilo.Infrastructure/Upkilo.Infrastructure.csproj \
            --startup-project src/backend/Upkilo.API/Upkilo.API.csproj \
            2>/dev/null | grep -v '(Pending)' | tail -1 | tr -d '[:space:]')
          if [ -z "$CURRENT" ]; then
            echo "::warning::Could not determine the currently-applied migration. Set ROLLBACK_TARGET_MIGRATION manually before relying on automatic schema rollback."
          else
            echo "✅ Current migration before this deploy: $CURRENT"
            {
              echo "### Rollback target for this deploy"
              echo ""
              echo "If this deploy needs to be rolled back, set this repository variable first so the rollback job's schema-rollback step has a real target:"
              echo '```bash'
              echo "gh variable set ROLLBACK_TARGET_MIGRATION --body \"$CURRENT\" --repo ${{ github.repository }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_PROD_DB_CONNECTION }}
          AzureKeyVault__VaultUri: ""

      - name: Apply migrations
        run: |
          dotnet ef database update \
            --project src/backend/Upkilo.Infrastructure/Upkilo.Infrastructure.csproj \
            --startup-project src/backend/Upkilo.API/Upkilo.API.csproj \
            --verbose
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_PROD_DB_CONNECTION }}
          AzureKeyVault__VaultUri: ""
          Jwt__Secret: "migration-placeholder-min-32-chars-not-used-for-auth-xxxxxxxxxx"
          Jwt__Issuer: "https://api.upkilo.com"
          Jwt__Audience: "https://app.upkilo.com"

      # MUST run even when the migration fails, or a failed deploy leaves the database
      # permanently reachable from a stale public IP. always() is deliberate here.
      - name: Remove temporary Postgres firewall rule
        if: always() && steps.fw.outputs.rule_name != ''
        uses: azure/CLI@v3
        with:
          inlineScript: |
            az postgres flexible-server firewall-rule delete \
              --resource-group upkilo-prod-rg \
              --server-name upkilo-prod-db \
              --name "${{ steps.fw.outputs.rule_name }}" \
              --yes --output none || echo "⚠️ Rule already absent"
            echo "🔒 Temporary firewall rule removed"

  # ── Deploy to Production (requires manual approval) ───────────────
  #
  # Gates before this job runs: the image built, and migrations applied. When
  # STAGING_ENABLED=true the migration is additionally rehearsed against a staging
  # database first; while staging is unprovisioned those jobs skip (see migrate-database's
  # `if:`, which distinguishes skipped from failed).
  #
  # ⚠️ B1 App Service tier does NOT support deployment slots, so there is no blue/green
  # swap. Deployment is direct and incurs roughly 30–60s of downtime per release while
  # the container restarts. Rollback works by redeploying the previously running image
  # tag, captured below before anything changes.
  #
  # To restore zero-downtime deploys, upgrade the plan to Standard (S1) or higher and
  # reinstate slot deployment:
  #   az appservice plan update -g upkilo-prod-rg -n upkilo-prod-plan --sku S1
  deploy-production:
    name: Deploy → Production
    needs: [build-and-push, migrate-database]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # MANUAL GATE — see migrate-database above. Production is only ever deployed by an
    # explicit "Run workflow", never by a push to main.
    #
    # `always()` is required for the same reason as migrate-database: deploy-staging is
    # skipped while STAGING_ENABLED is unset, and that skip propagates DOWN the needs graph.
    # Without always() this job inherited the skip and silently did nothing — the run
    # reported "Success" having only migrated the database and never deployed. The explicit
    # result checks keep a genuine failure upstream blocking the deploy.
    #
    # See migrate-database: `inputs.environment == 'production'` is the guard that stops a
    # "staging" dispatch from deploying production.
    if: >-
      always()
      && github.event_name == 'workflow_dispatch'
      && inputs.environment == 'production'
      && needs.build-and-push.result == 'success'
      && needs.migrate-database.result == 'success'
    # The environment restricts deployments to the `main` branch. On GitHub Free with a
    # private repo it cannot enforce required reviewers; upgrading to Pro/Team (or making
    # the repo public) enables that, at which point the `if:` above becomes redundant.
    environment: production
    # Exposed so the rollback job can restore whatever was running before this deploy.
    outputs:
      api_image: ${{ steps.prev.outputs.api_image }}
      frontend_image: ${{ steps.prev.outputs.frontend_image }}

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Capture the currently-running images BEFORE deploying. Without slots this is the
      # only way to roll back, and it must happen before any mutation.
      - name: Capture current image tags for rollback
        id: prev
        uses: azure/CLI@v3
        with:
          inlineScript: |
            API_IMG=$(az webapp config container show --name upkilo-api-prod \
              --resource-group upkilo-prod-rg \
              --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" -o tsv 2>/dev/null || echo "")
            FE_IMG=$(az webapp config container show --name upkilo-frontend-prod \
              --resource-group upkilo-prod-rg \
              --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" -o tsv 2>/dev/null || echo "")
            echo "api_image=$API_IMG" >> $GITHUB_OUTPUT
            echo "frontend_image=$FE_IMG" >> $GITHUB_OUTPUT
            echo "Previous API image:      ${API_IMG:-<none>}"
            echo "Previous frontend image: ${FE_IMG:-<none>}"

      # Inject secrets as App Service application settings before deploying the image.
      # Without this step, APPLICATIONINSIGHTS_CONNECTION_STRING and PAGERDUTY_INTEGRATION_KEY
      # never reach the running container — AppInsights and PagerDuty silently do nothing.
      - name: Configure App Service application settings
        uses: azure/CLI@v3
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name upkilo-api-prod \
              --resource-group upkilo-prod-rg \
              --settings \
                APPLICATIONINSIGHTS_CONNECTION_STRING="${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}" \
                PagerDuty__IntegrationKey="${{ secrets.PAGERDUTY_INTEGRATION_KEY }}" \
                SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
                ConnectionStrings__Redis="${{ secrets.REDIS_CONNECTION }}" \
                ConnectionStrings__DefaultConnection="${{ secrets.AZURE_PROD_DB_CONNECTION }}" \
                ConnectionStrings__ReplicaConnection="${{ secrets.AZURE_PROD_DB_REPLICA_CONNECTION || secrets.AZURE_PROD_DB_CONNECTION }}" \
                Jwt__Secret="${{ secrets.JWT_SECRET }}" \
                Stripe__SecretKey="${{ secrets.STRIPE_SECRET_KEY }}" \
                Stripe__WebhookSecret="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
                Stripe__PublishableKey="${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
                Razorpay__KeyId="${{ secrets.RAZORPAY_KEY_ID }}" \
                Razorpay__KeySecret="${{ secrets.RAZORPAY_KEY_SECRET }}" \
                SendGrid__ApiKey="${{ secrets.SENDGRID_API_KEY }}" \
                Twilio__AccountSid="${{ secrets.TWILIO_ACCOUNT_SID }}" \
                Twilio__AuthToken="${{ secrets.TWILIO_AUTH_TOKEN }}" \
                Twilio__PhoneNumber="${{ secrets.TWILIO_PHONE_NUMBER }}" \
                AzureOpenAI__Endpoint="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
                AzureOpenAI__ApiKey="${{ secrets.AZURE_OPENAI_API_KEY }}" \
                Azure__Storage__ConnectionString="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
                VAPID__PublicKey="${{ secrets.VAPID_PUBLIC_KEY }}" \
                VAPID__PrivateKey="${{ secrets.VAPID_PRIVATE_KEY }}" \
                ASPNETCORE_ENVIRONMENT="Production" \
                AzureKeyVault__VaultUri=""
            echo "✅ App Service settings configured"

      # appsettings.Production.json declares the DB connection strings as "${DATABASE_URL}"
      # placeholders, but .NET does NOT expand ${...} and no Key Vault *configuration provider*
      # is registered — only a runtime ISecretProvider used for the JWT signing key. Without the
      # two ConnectionStrings__* settings above, the container boots with the literal text and
      # dies immediately:
      #   System.ArgumentException: Couldn't set ${database_url};ssl mode
      # Fail fast here rather than discovering it from a crash-looping container.
      - name: Verify DB connection settings reached App Service
        uses: azure/CLI@v3
        with:
          inlineScript: |
            VALUE=$(az webapp config appsettings list \
              --name upkilo-api-prod \
              --resource-group upkilo-prod-rg \
              --query "[?name=='ConnectionStrings__DefaultConnection'].value | [0]" -o tsv)
            if [ -z "$VALUE" ]; then
              echo "::error::ConnectionStrings__DefaultConnection is not set on the App Service. Set the AZURE_PROD_DB_CONNECTION secret."
              exit 1
            fi
            if echo "$VALUE" | grep -q '\${'; then
              echo "::error::ConnectionStrings__DefaultConnection still contains an unexpanded \${...} placeholder."
              exit 1
            fi
            echo "✅ DB connection string present and expanded"

      # Direct deployment — B1 has no slots. Deploy API first, prove it healthy, then
      # the frontend. Ordering matters: a new frontend calling an old API is the worse
      # failure mode, since the API is backward-compatible with the previous frontend
      # but not necessarily forward-compatible with the new one.
      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: upkilo-api-prod
          images: ${{ env.REGISTRY }}/upkilo-api:${{ github.sha }}

      # Use /ready (readiness) not /health (liveness). /health only checks memory/uptime;
      # /ready verifies DB connection, Redis, and Hangfire.
      # B1 has no always-on warm instance, so cold start is slow — hence 4 minutes.
      #
      # Gate on "not Unhealthy", NOT on "== Healthy" — matching the staging gate above.
      # report.Status is the WORST status across every check, and HangfireHealthCheck
      # reports Degraded on a job BACKLOG (failed > 50 / enqueued > 1000), not on an
      # outage. That backlog lives in the Hangfire tables in Postgres and survives every
      # deploy, so a strict Healthy test made each subsequent deploy poll for the full
      # 240s and roll back an API that was serving traffic correctly — postgresql, redis,
      # connection-pool, pricing and the bus were all Healthy throughout.
      # Degraded means "serving, but suboptimal"; only Unhealthy (enqueued > 5000) is an
      # actual reason to refuse the release. Same reasoning as the elasticsearch tag
      # comment in Program.cs.
      - name: Wait for API readiness
        run: |
          echo "Polling API /ready (max 240s — B1 cold start is slow)..."
          deadline=$((SECONDS + 240))
          until curl -sf https://upkilo-api-prod.azurewebsites.net/ready \
                | jq -e '.status != "Unhealthy"' > /dev/null 2>&1; do
            if [ $SECONDS -ge $deadline ]; then
              echo "❌ API readiness timed out — rollback will trigger"
              curl -s https://upkilo-api-prod.azurewebsites.net/ready | jq . || true
              exit 1
            fi
            echo "  not ready, retrying in 10s..."
            sleep 10
          done
          echo "✅ API READY (nothing Unhealthy)"
          # Degraded now passes the gate, so it MUST stay visible — otherwise a real job
          # backlog or soft-dependency failure ships silently forever.
          curl -s https://upkilo-api-prod.azurewebsites.net/ready \
            | jq -r '.checks[]? | select(.status != "Healthy")
                     | "::warning::readiness: \(.name) is \(.status)"' || true

      # NextAuth v5 refuses to start without a signing secret and returns
      # "There was a problem with the server configuration" from every /api/auth/* route —
      # so login fails even though the API issues valid JWTs. These are RUNTIME settings
      # (unlike NEXT_PUBLIC_* which are baked at build), so they must live here.
      - name: Configure Frontend App Service application settings
        uses: azure/CLI@v3
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name upkilo-frontend-prod \
              --resource-group upkilo-prod-rg \
              --settings \
                AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
                NEXTAUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
                AUTH_TRUST_HOST="true" \
                NEXTAUTH_URL="https://app.upkilo.com" \
              --output none
            echo "✅ Frontend App Service settings configured"

      - name: Deploy Frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: upkilo-frontend-prod
          images: ${{ env.REGISTRY }}/upkilo-frontend:${{ github.sha }}

      - name: Wait for frontend health
        run: |
          echo "Polling frontend /api/health (max 240s)..."
          deadline=$((SECONDS + 240))
          until curl -sf https://upkilo-frontend-prod.azurewebsites.net/api/health \
                > /dev/null 2>&1; do
            if [ $SECONDS -ge $deadline ]; then
              echo "❌ Frontend health timed out — rollback will trigger"
              exit 1
            fi
            sleep 10
          done
          echo "✅ Frontend healthy"

      # No Front Door in this deployment (cost). Cloudflare fronts the domains instead
      # and does not cache HTML by default, so no purge step is required. If Cloudflare
      # page rules are later added to cache HTML, add a purge here.
      - name: Post-deploy production smoke test
        run: |
          sleep 20
          curl -f https://api.upkilo.com/health \
            --retry 5 --retry-delay 10 \
            || (echo "❌ Production health check FAILED" && exit 1)
          curl -f https://api.upkilo.com/ready \
            --retry 5 --retry-delay 10 \
            || (echo "❌ Production readiness FAILED" && exit 1)
          echo "✅ Production deployment verified — ${{ github.sha }}"

      # §5.5: Non-fatal Elasticsearch check — ES down should not block deploy
      # (core booking/payment/CRM works without it; search degrades gracefully)
      - name: Verify Elasticsearch via readiness endpoint (non-fatal)
        run: |
          READY=$(curl -sf https://api.upkilo.com/ready | jq -r '.checks[] | select(.name=="elasticsearch") | .status' 2>/dev/null || echo "unknown")
          if [ "$READY" = "Healthy" ]; then
            echo "✅ Elasticsearch: Healthy"
          else
            echo "⚠️ Elasticsearch status: $READY — search features may be degraded. Non-blocking."
          fi

      - name: Notify on success
        if: success()
        run: |
          echo "🚀 Deploy SUCCESS: ${{ github.sha }} → production at $(date -u)"

  # ── Rollback (automatic on deploy-production or migrate-database failure) ────────
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # always() + explicit result checks, same pattern as migrate-database/deploy-production
    # above: a migrate-database failure leaves deploy-production "skipped", not "failure",
    # so failure() alone (which only looks at whether upstream jobs failed) would miss it —
    # and a failed migration can leave the database partially migrated with nobody notified.
    # Container rollback is skipped in that case (see the per-step guards below), since
    # deploy-production never ran and never touched a container; schema rollback still
    # applies, since that is exactly the state migrate-database can leave behind.
    if: >-
      always()
      && (needs.deploy-production.result == 'failure' || needs.migrate-database.result == 'failure')
    needs: [deploy-production, migrate-database]
    # DO NOT add `environment: production` here — environment protection gates
    # (required reviewers) block jobs triggered by failure(), making the rollback
    # impossible to execute automatically during an incident.

    steps:
      - uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # No slots on B1, so rollback redeploys the image tags captured by the
      # "Capture current image tags" step before this deploy mutated anything.
      # If a tag is empty this was the first-ever deploy — there is nothing to roll
      # back to, and the container is left as-is for manual inspection.
      - name: Rollback API to previous image
        # Skipped when migrate-database failed before deploy-production ever ran: there is
        # no new container deployment to undo, only a possible partial migration (handled
        # by the schema-rollback step below). success() preserves the original implicit
        # "only run if earlier steps in this job succeeded" behavior that an explicit `if:`
        # otherwise replaces rather than adds to.
        if: success() && needs.deploy-production.result == 'failure'
        uses: azure/CLI@v3
        with:
          inlineScript: |
            PREV="${{ needs.deploy-production.outputs.api_image }}"
            if [ -z "$PREV" ] || echo "$PREV" | grep -q "appsvc/staticsite"; then
              echo "⚠️ No previous API image recorded (first deploy) — skipping API rollback."
            else
              az webapp config container set \
                --name upkilo-api-prod \
                --resource-group upkilo-prod-rg \
                --docker-custom-image-name "$PREV"
              az webapp restart --name upkilo-api-prod --resource-group upkilo-prod-rg
              echo "⏪ API ROLLBACK complete — restored to $PREV"
            fi

      - name: Rollback frontend to previous image
        if: success() && needs.deploy-production.result == 'failure'
        uses: azure/CLI@v3
        with:
          inlineScript: |
            PREV="${{ needs.deploy-production.outputs.frontend_image }}"
            if [ -z "$PREV" ] || echo "$PREV" | grep -q "appsvc/staticsite"; then
              echo "⚠️ No previous frontend image recorded (first deploy) — skipping frontend rollback."
            else
              az webapp config container set \
                --name upkilo-frontend-prod \
                --resource-group upkilo-prod-rg \
                --docker-custom-image-name "$PREV"
              az webapp restart --name upkilo-frontend-prod --resource-group upkilo-prod-rg
              echo "⏪ Frontend ROLLBACK complete — restored to $PREV"
            fi

      # Schema rollback: revert to the migration that was current before this deploy.
      # Without this, old code runs against a schema that may have dropped columns it reads.
      - name: Setup .NET for schema rollback
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Rollback database schema to pre-deploy snapshot
        run: |
          # Revert to the migration immediately before this deploy's first new migration.
          # ROLLBACK_TARGET_MIGRATION must be set as a repository variable pointing to
          # the last migration applied on the previous successful deploy (e.g. "20260623021555_SC2_HashPartitioning").
          # If not set, schema rollback is skipped and a manual DBA review is required.
          TARGET="${{ vars.ROLLBACK_TARGET_MIGRATION }}"
          if [ -z "$TARGET" ]; then
            echo "⚠️ ROLLBACK_TARGET_MIGRATION not set — skipping schema rollback."
            echo "   Manually run: dotnet ef database update <previous-migration-name>"
          else
            echo "Rolling schema back to: $TARGET"
            dotnet ef database update "$TARGET" \
              --project src/backend/Upkilo.Infrastructure/Upkilo.Infrastructure.csproj \
              --startup-project src/backend/Upkilo.API/Upkilo.API.csproj \
              --verbose
            echo "⏪ Schema rollback complete to $TARGET"
          fi
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_PROD_DB_CONNECTION }}
          AzureKeyVault__VaultUri: ""
          Jwt__Secret: "rollback-placeholder-min-32-chars-not-used-for-auth-xxxxxxxxxx"
          Jwt__Issuer: "https://api.upkilo.com"
          Jwt__Audience: "https://app.upkilo.com"

      - name: Notify on rollback
        run: |
          if [ "${{ needs.deploy-production.result }}" = "failure" ]; then
            echo "🚨 ROLLBACK TRIGGERED for ${{ github.sha }} at $(date -u). Check deploy logs and PagerDuty."
          else
            echo "🚨 MIGRATION FAILED for ${{ github.sha }} at $(date -u), before deploy-production ran. Containers were NOT touched — the database may be partially migrated. Check deploy logs and PagerDuty, then verify schema state manually before retrying."
          fi
