name: "CodeQL Advanced"

# ── Why this does not upload to code scanning ────────────────────────────────────────
# Uploading SARIF to GitHub code scanning requires GitHub Advanced Security, which is not
# available for private repositories on the Free plan. Verified against the API: the
# code-scanning endpoint returns
#   403 "Code scanning is not enabled for this repository."
# so every run that tried to upload failed at the final step, and a permanently-red check
# trains people to ignore red checks.
#
# The analysis itself does NOT need Advanced Security — only the upload does. So this runs
# CodeQL for real and keeps the SARIF locally (`upload: never` + `output:`), publishing it
# as a build artifact instead. The findings are produced and retrievable today; they are
# just reviewed by downloading the artifact rather than in the Security tab.
#
# TO RESTORE THE SECURITY TAB once Advanced Security is available (GitHub Team/Enterprise,
# or making the repository public): drop the `upload`/`output` inputs and the artifact
# step, and the action reverts to its default of uploading.
#
# Scheduled weekly rather than per-push on purpose: a CodeQL run builds the whole C#
# solution, and Actions minutes on a private repo are a limited budget. Use the manual
# trigger when a specific change warrants a scan sooner.
on:
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    # autobuild cannot detect how to build this solution ("Could not auto-detect a
    # suitable build method"), so C# is built explicitly. JavaScript needs no build step.
    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    - name: Build C# solution
      if: matrix.language == 'csharp'
      run: dotnet build src/backend/Upkilo.sln --configuration Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        upload: never
        output: sarif-results

    - name: Publish SARIF as an artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: codeql-sarif-${{ matrix.language }}
        path: sarif-results
        if-no-files-found: warn
