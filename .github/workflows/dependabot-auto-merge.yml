name: Dependabot Auto-Merge

# The Security & Dependency Agent's autonomy boundary (see
# "_archive/planning/pre-launch-research-and-audits/autonomous_production_agents_plan.md" section 1).
# .github/dependabot.yml already opens weekly PRs for nuget + npm + github-actions; this
# workflow is what actually removes the human from merging the safe ones. It only ever
# merges patch/minor version bumps, and only after this repo's full ci.yml suite has
# passed on the PR — a major bump always waits for a human.
#
# ── Why this is shaped the way it is ─────────────────────────────────────────────────
# Three repo/plan constraints were checked against the API before re-enabling this. Each
# one would have silently broken the previous version of this workflow, which is why it
# never worked even during the window it was enabled:
#
#  1. `allow_auto_merge` is false on this repository, so `gh pr merge --auto` fails with
#     "Auto-merge is not allowed for this repository". The merge below is a plain
#     `--squash`, gated by the explicit wait-for-CI step rather than by --auto.
#  2. `can_approve_pull_request_reviews` is false, so a GITHUB_TOKEN `gh pr review
#     --approve` is rejected. There is no branch protection requiring an approval either
#     (GitHub Free cannot protect branches on a private repo), so the approve step bought
#     nothing and has been removed rather than left to fail.
#  3. The previous trigger was `pull_request_target`, which runs in the base-repo context
#     with write-scoped secrets. Dependabot PRs originate in this repository rather than a
#     fork, so the documented `pull_request` trigger plus an explicit `permissions:` block
#     does the same job without exposing that context.
#
# The safety argument rests on ci.yml passing first, which the wait step enforces. Merging
# to `main` builds and pushes images but does NOT deploy — deploy.yml requires a manual
# run — so an auto-merged bump cannot reach production unattended.
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  # `checks: read` is required by the wait-on-check-action step below, which lists check
  # runs for the PR head SHA. Without it that call returns
  #   GET /repos/.../commits/<sha>/check-runs -> 403 Resource not accessible by integration
  # and the job dies before evaluating anything. This is not implied by contents/pull-requests:
  # declaring a `permissions:` block drops every scope that is not named, so the check-runs
  # API stays unreachable no matter how broad the other two are.
  checks: read

jobs:
  auto-merge:
    name: Evaluate Dependabot PR
    runs-on: ubuntu-latest
    # The PR author, not github.actor: github.actor is whoever caused the event, which on
    # a re-run is the person who pressed the button rather than Dependabot.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # allowed-conclusions includes `skipped`, not just `success`. ci.yml's jobs are
      # gated by path filters (detect-changes) and an explicit dependabot-author exclusion
      # on T5 Lighthouse CI, so a legitimate, safe PR routinely has jobs report "skipped"
      # rather than "success" — Lighthouse is skipped on every Dependabot PR by design,
      # and Backend/Frontend Build skip whenever a PR only touches one side. With
      # `allowed-conclusions: success` alone that skip was indistinguishable from a
      # failure: this step rejected 27 of the last 28 Dependabot PRs it evaluated
      # (confirmed from run history), so auto-merge had never actually merged anything on
      # its own. A real failure still reports "failure"/"cancelled"/"timed_out" — none of
      # which are in this list — so this does not weaken the gate, it stops penalizing
      # checks that intentionally did not run.
      - name: Wait for CI (ci.yml) to report success on this PR
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          running-workflow-name: "Evaluate Dependabot PR"
          allowed-conclusions: success,skipped

      - name: Merge patch/minor bumps
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge "$PR_URL" --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major bumps for human review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "🔒 Major version bump — outside the Security Agent's auto-merge scope. Needs human review (see autonomous_production_agents_plan.md, section 3: scope fence)."
          gh pr edit "$PR_URL" --add-label "needs-human-review"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
