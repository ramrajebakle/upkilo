[databases]
; SC6: Tenant-aware connection pooling.
; All app connections hit this PgBouncer instance at port 5433.
; PgBouncer pools them into the real PostgreSQL at port 5432.
upkilo_prod = host=postgres port=5432 dbname=upkilo_prod pool_size=20
upkilo_test = host=postgres port=5432 dbname=upkilo_test pool_size=5

[pgbouncer]
; Listen on port 5433 so the app points at PgBouncer, not Postgres directly
listen_port = 5433
listen_addr = 0.0.0.0

; SC6: Transaction pooling — best for short OLTP queries (API requests).
; Session pooling (the default) ties a server connection to a client for the whole session.
; Transaction mode releases it after each transaction — 10× better connection utilisation.
pool_mode = transaction

; Maximum client connections (all app instances combined)
max_client_conn = 500

; Default server pool size per database+user combination
default_pool_size = 25

; SC6: Reserve pool for large tenants — when default pool is exhausted, these 10
; connections are used only by reservation (queries that waited > reserve_pool_timeout).
reserve_pool_size = 10
reserve_pool_timeout = 3

; Kill idle server connections after 10 minutes to free Postgres slots
server_idle_timeout = 600

; Kill client connections idle in the pool for > 1 hour
client_idle_timeout = 3600

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; Admin interface (localhost only — monitoring)
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats
